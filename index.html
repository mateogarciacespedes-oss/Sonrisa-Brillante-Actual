<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>Iniciar sesión | Sonrisa Brillante</title>

        <link
            rel="stylesheet"
            href="css/style.css"
        >

        <script src="https://accounts.google.com/gsi/client" async defer></script>

    </head>

    <body>


        <!-- ENCABEZADO -->
        <header class="main-header">

            <div class="brand">

                <div class="brand-icon">
                    🦷
                </div>

                <div>

                    <h1>
                        Sonrisa Brillante
                    </h1>

                    <p>
                        Sistema de Gestión Odontológica
                    </p>

                </div>

            </div>

        </header>



        <!-- CONTENIDO PRINCIPAL -->
        <main class="login-container">


            <!-- TARJETA DE LOGIN -->

            <section class="login-card">


                <div class="login-header">

                    <div class="login-icon">
                        🦷
                    </div>

                    <h2>
                        Iniciar sesión
                    </h2>

                    <p class="login-description">
                        Ingresa tus datos para acceder al sistema.
                    </p>

                </div>



                <!-- FORMULARIO -->
                <form>


                    <div class="form-group">

                        <label for="usuario">
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingresa tu usuario"
                        >

                    </div>



                    <div class="form-group">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresa tu contraseña"
                        >

                    </div>



                    <!-- OPCIONES -->
                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                name="recordarme"
                            >

                            <span>
                                Recordarme
                            </span>

                        </label>


                        <a
                            href="paginas/recuperar-contrasena.html"
                            class="forgot-password"
                        >
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>



                    <!-- BOTÓN -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Iniciar sesión
                    </button>

                    
                    <div class="google-login">
                        <div class="google-separador">
                            <span>O también puedes ingresar con</span>
                        </div>

                        <div id="googleSignInButton"></div>
                    </div>


                </form>


            </section>


        </main>



        <!-- FOOTER -->
        <footer class="main-footer">

            <p>
                © 2026 Sonrisa Brillante.
                Todos los derechos reservados.
            </p>

        </footer>

        <script src="js/login.js"></script>


    </body>

</html>
